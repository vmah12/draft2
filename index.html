<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>American Badgers in Canada · The Badger Trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style id="css">
  :root{
    --cream:#F6EFE4; --paper:#FFFBF5; --sand:#EADCC8; --sand-2:#E2D0B8; --latte:#CDB396;
    --brown:#9A7656; --cocoa:#5E4534; --ink:#3D2E24; --muted:#8C7765;
    --road:#47403D; --road-edge:#5C5450; --dash:#FBE3BC;
    --sage:#DCE3CF; --sage-d:#6E8A5C; --blush:#F6D3C8; --berry:#C8705C;
    --radius:26px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;overflow-x:clip}
  .journey{overflow-x:clip}
  body{margin:0;overflow-x:clip;background:var(--cream);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:17px;line-height:1.55;overflow-x:hidden}
  h1,h2,h3,.fred{font-family:"Fredoka","Nunito",sans-serif}
  button{font:inherit;color:inherit;cursor:pointer}
  button:focus-visible{outline:3px solid var(--brown);outline-offset:3px}

  /* ---------- top bar ---------- */
  .topbar{position:fixed;inset:0 0 auto 0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px clamp(14px,3vw,32px);background:rgba(246,239,228,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:2px solid rgba(205,179,150,.35)}
  .brand{display:flex;align-items:center;gap:8px;font-family:"Fredoka";font-weight:600;font-size:19px;color:var(--cocoa);text-decoration:none}
  .brand svg{width:38px;height:38px}
  .top-right{display:flex;align-items:center;gap:10px;position:relative}
  .paw-pill{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--sand);border-radius:999px;padding:6px 14px;font-weight:800;color:var(--cocoa);font-size:15px;transition:transform .25s}
  .paw-pill.bump{transform:scale(1.15)}
  .paw-pill svg{width:18px;height:18px}
  .map-btn{background:var(--cocoa);color:var(--paper);border:0;border-radius:999px;padding:8px 16px;font-weight:800;font-size:15px;box-shadow:0 4px 0 #3e2c20}
  .map-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #3e2c20}
  .map-menu{position:absolute;right:0;top:calc(100% + 10px);background:var(--paper);border:2px solid var(--sand);border-radius:20px;padding:10px;min-width:240px;
    box-shadow:0 14px 30px rgba(94,69,52,.15);opacity:0;transform:translateY(-6px) scale(.98);pointer-events:none;transition:.2s}
  .map-menu.open{opacity:1;transform:none;pointer-events:auto}
  .map-menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:14px;padding:9px 10px;font-weight:700;color:var(--cocoa)}
  .map-menu button:hover{background:var(--cream)}
  .map-menu .dot{width:26px;height:26px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-family:"Fredoka";font-size:14px;color:var(--cocoa);flex:none}

  /* ---------- journey + road ---------- */
  .journey{position:relative;max-width:1120px;margin:0 auto;padding:0 clamp(14px,3vw,28px)}
  .road{position:absolute;top:0;left:0;z-index:0;overflow:visible;pointer-events:none}
  .decor{position:absolute;inset:0;z-index:0;pointer-events:none}
  .fern{position:absolute;width:90px;opacity:.55}
  .walker-bob{animation:bob .9s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-5px) rotate(4deg)}}

  /* ---------- hero ---------- */
  .hero{position:relative;z-index:1;text-align:center;padding:120px 0 40px}
  .blob{position:absolute;z-index:-1;border-radius:50%;background:var(--sand)}
  .kicker{display:inline-block;background:var(--paper);border:2px solid var(--sand);color:var(--brown);font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;padding:6px 16px;border-radius:999px}
  .hero h1{font-size:clamp(46px,8vw,92px);line-height:.95;margin:18px 0 10px;color:var(--cocoa);font-weight:700;letter-spacing:-.01em}
  .hero h1 .t2{color:var(--brown)}
  .hero p.lead{max-width:540px;margin:0 auto;color:var(--muted);font-size:clamp(17px,2.2vw,20px);font-weight:600}
  .hero-badger{width:clamp(220px,32vw,300px);margin:26px auto 0;position:relative}
  .hero-badger .halo{position:absolute;inset:8% 4% 0;background:var(--sand);border-radius:50% 50% 46% 46%;z-index:-1}
  .hero-badger svg{display:block;width:100%;animation:float 4s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .hero-badger:hover svg{animation:wiggle .5s ease}
  @keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
  .start-btn{margin-top:22px;background:var(--brown);color:var(--paper);border:0;border-radius:999px;padding:14px 28px;font-family:"Fredoka";font-size:20px;font-weight:600;box-shadow:0 6px 0 var(--cocoa);transition:transform .15s}
  .start-btn:hover{transform:translateY(-2px)}
  .start-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--cocoa)}
  .team{margin-top:16px;color:var(--muted);font-size:14px;font-weight:700}
  .road-start{height:90px}

  /* ---------- stops ---------- */
  .stop{position:relative;z-index:1;margin-bottom:170px;scroll-margin-top:90px}
  .stop-sign{position:absolute;top:-6px;transform:translateX(-50%);z-index:3;text-align:center}
  .stop[data-side="left"] .stop-sign{left:15%}
  .stop[data-side="right"] .stop-sign{left:85%}
  .stop-sign .num{display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--paper);border:5px solid var(--brown);font-family:"Fredoka";font-size:28px;font-weight:700;color:var(--cocoa);box-shadow:0 6px 0 rgba(61,46,36,.18)}
  .stop-sign .lbl{display:inline-block;margin-top:8px;background:var(--cocoa);color:var(--paper);font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
  .card{position:relative;background:var(--paper);border:2px solid var(--sand);border-radius:var(--radius);padding:clamp(22px,3vw,36px);box-shadow:0 10px 0 var(--sand-2);width:68%}
  .stop[data-side="left"] .card{margin-left:32%}
  .stop[data-side="right"] .card{margin-right:32%}
  .card-head .tag{display:inline-block;background:var(--cream);color:var(--brown);font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;padding:4px 12px;border-radius:999px}
  .card-head h2{font-size:clamp(28px,3.6vw,40px);margin:10px 0 2px;color:var(--cocoa);line-height:1.1}
  .card-head .sub{margin:0 0 18px;color:var(--muted);font-weight:700}
  .block{margin-top:20px}
  .block-title{font-family:"Fredoka";font-weight:600;color:var(--brown);font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .ph{margin:0;color:var(--muted);font-style:italic;background:repeating-linear-gradient(-45deg,transparent 0 10px,rgba(234,220,200,.35) 10px 20px);border:2px dashed var(--sand-2);border-radius:16px;padding:12px 16px}
  .img-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:180px;border:3px dashed var(--latte);border-radius:20px;background:var(--cream);color:var(--brown);font-weight:800}
  .img-ph span{font-size:34px}

  /* accordion */
  .acc{display:flex;flex-direction:column;gap:10px}
  .acc-item{background:var(--cream);border-radius:18px;border:2px solid transparent;transition:border-color .2s,background .2s}
  .acc-item.open{background:#fff;border-color:var(--sand)}
  .acc-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;background:none;border:0;padding:14px 16px;text-align:left;font-weight:800;font-size:17px;color:var(--cocoa)}
  .acc-icon{flex:none;width:32px;height:32px;border-radius:50%;background:var(--latte);color:#fff;display:grid;place-items:center;font-size:22px;line-height:1;transition:transform .3s,background .3s}
  .open .acc-icon{transform:rotate(45deg);background:var(--brown)}
  .acc-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
  .open .acc-panel{grid-template-rows:1fr}
  .acc-inner{overflow:hidden}
  .acc-inner > div{padding:0 16px 16px}

  /* flip cards */
  .flips{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
  .flip{background:none;border:0;padding:0;height:190px;perspective:900px;text-align:center}
  .flip-inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
  .flip.flipped .flip-inner{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:14px}
  .front{background:var(--cream);border:2px solid var(--sand)}
  .front .ficon{font-size:40px}
  .front b{font-family:"Fredoka";font-weight:600;font-size:19px;color:var(--cocoa);line-height:1.15}
  .front small{color:var(--muted);font-weight:700}
  .back{background:var(--cocoa);color:var(--paper);transform:rotateY(180deg);font-size:15px}
  .back .ph{color:#E9D9C4;border-color:rgba(255,255,255,.25);background:none;font-size:15px}
  .flip:hover .front{border-color:var(--latte)}

  /* questions */
  .check{background:var(--cream);border-radius:20px;padding:18px}
  .check .q{margin:0 0 12px;font-weight:800;color:var(--cocoa);font-size:18px}
  .opts{display:grid;gap:10px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opt{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--sand);border-radius:16px;padding:12px 14px;text-align:left;font-weight:700;color:var(--ink);transition:transform .15s,border-color .2s,background .2s}
  .opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--latte)}
  .opt .letter{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-family:"Fredoka";font-weight:600;color:var(--cocoa)}
  .opt:disabled{cursor:default}
  .opt.right{background:var(--sage);border-color:var(--sage-d)}
  .opt.right .letter{background:var(--sage-d);color:#fff}
  .opt.wrong{background:var(--blush);border-color:var(--berry);animation:shake .4s}
  .opt.wrong .letter{background:var(--berry);color:#fff}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  .fb{margin:12px 0 0;font-weight:800;min-height:0}
  .fb.good{color:var(--sage-d)} .fb.bad{color:var(--berry)}
  .fb .ph{margin-top:8px;font-weight:600}

  /* pledge */
  .pledge{display:grid;gap:10px}
  .pledge-item{display:flex;align-items:center;gap:12px;background:var(--cream);border:2px solid transparent;border-radius:16px;padding:12px 14px;text-align:left;font-weight:700;color:var(--cocoa);transition:.2s}
  .pledge-item .box{flex:none;width:30px;height:30px;border-radius:10px;border:3px solid var(--latte);background:#fff;display:grid;place-items:center;font-size:16px;color:transparent;transition:.2s}
  .pledge-item[aria-pressed="true"]{background:var(--sage);border-color:var(--sage-d)}
  .pledge-item[aria-pressed="true"] .box{background:var(--sage-d);border-color:var(--sage-d);color:#fff}

  /* quiz */
  .quiz{background:var(--cream);border-radius:22px;padding:20px}
  .quiz-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;font-weight:800;color:var(--brown);font-size:14px;letter-spacing:.05em;text-transform:uppercase}
  .qdots{display:flex;gap:6px}
  .qdots i{width:12px;height:12px;border-radius:50%;background:var(--sand-2);transition:.3s}
  .qdots i.done{background:var(--brown)} .qdots i.now{background:var(--latte);transform:scale(1.3)}
  .quiz .q{font-family:"Fredoka";font-weight:600;font-size:22px;color:var(--cocoa);margin:0 0 14px;line-height:1.25}
  .next-btn{margin-top:14px;background:var(--cocoa);color:var(--paper);border:0;border-radius:999px;padding:11px 22px;font-weight:800;box-shadow:0 4px 0 #3e2c20}
  .next-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #3e2c20}
  .result{text-align:center;padding:8px}
  .result svg{width:150px}
  .result h3{font-size:30px;margin:6px 0 4px;color:var(--cocoa)}
  .stars{font-size:30px;letter-spacing:4px}

  /* den */
  .den{position:relative;z-index:1;text-align:center;padding:0 0 60px}
  .road-end{height:10px}
  .den-mound{width:min(420px,90%);margin:0 auto;display:block}
  .den h2{font-size:clamp(32px,5vw,48px);color:var(--cocoa);margin:10px 0 4px}
  .den p{color:var(--muted);font-weight:700;margin:0}
  footer{position:relative;background:var(--latte);color:var(--paper);text-align:center;padding:30px 20px 34px;font-weight:700}
  footer::before{content:"";position:absolute;left:0;right:0;top:-38px;height:40px;background:var(--latte);
    -webkit-mask:radial-gradient(40px 40px at 40px 40px,#000 98%,transparent) 0 0/80px 40px repeat-x;mask:radial-gradient(40px 40px at 40px 40px,#000 98%,transparent) 0 0/80px 40px repeat-x}

  /* pops + confetti */
  .pop{position:fixed;z-index:60;font-family:"Fredoka";font-weight:700;color:var(--brown);pointer-events:none;animation:pop 1s ease forwards}
  @keyframes pop{0%{opacity:0;transform:translateY(0) scale(.6)}20%{opacity:1;transform:translateY(-8px) scale(1.1)}100%{opacity:0;transform:translateY(-40px)}}
  .confetti{position:fixed;top:-30px;z-index:70;pointer-events:none;font-size:24px;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

  /* citations + sources */
  .cite{font-size:.72em;line-height:0;vertical-align:super;margin:0 1px;font-weight:800;font-family:"Nunito",sans-serif}
  .cite a{display:inline-block;line-height:1.5;padding:0 6px;border-radius:8px;background:var(--cream);border:1px solid var(--latte);color:var(--brown);text-decoration:none}
  .cite a:hover,.cite a:focus-visible{background:var(--brown);border-color:var(--brown);color:#fff}
  .back .cite a{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.4);color:var(--dash)}
  .back .cite a:hover,.back .cite a:focus-visible{background:var(--dash);color:var(--cocoa)}
  .sources{list-style:none;margin:0;padding:0;display:grid;gap:10px}
  .sources li{display:flex;gap:12px;align-items:flex-start;background:var(--cream);border-radius:16px;padding:12px 14px;scroll-margin-top:90px}
  .sources .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-family:"Fredoka";font-weight:600;color:var(--cocoa)}
  .sources a{font-weight:800;color:var(--cocoa);text-decoration:underline;text-decoration-color:var(--latte);text-underline-offset:3px;word-break:break-word}
  .sources a:hover{color:var(--brown)}
  .sources .host{display:block;color:var(--muted);font-size:14px;font-weight:700;word-break:break-word}
  .sources .ph{margin:0}
  /* corner source badges */
  /* main-message stop stands out */
  .stop[data-main] .card{border-color:var(--berry);background:#FFF8F3;box-shadow:0 12px 0 #E9BBAA}
  .stop[data-main] .stop-sign .num{border-color:var(--berry);width:74px;height:74px;font-size:32px}
  .stop[data-main] .stop-sign .lbl{background:var(--berry)}
  .stop[data-main] .card-head .tag{background:var(--berry);color:#fff}
  .stop[data-main] .card-head h2{font-size:clamp(34px,4.6vw,52px)}
  @media (max-width:760px){.stop[data-main] .stop-sign .num{width:50px;height:50px;font-size:22px}}
  .boxc{position:relative}
  /* three-threats block */
  .threats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px 16px;margin-top:6px}
  .threat{position:relative;display:flex;flex-direction:column;gap:10px;background:#fff;border:3px solid var(--blush);border-radius:20px;padding:16px 14px 14px}
  .threat h3{margin:0;font-family:"Fredoka",sans-serif;font-size:22px;line-height:1.15;color:var(--cocoa)}
  .threat .txt{margin:0}
  .timg{width:100%;height:150px;object-fit:cover;border-radius:12px;border:2px solid var(--sand)}
  .threat .img-ph{height:150px}
  .tnum{position:absolute;top:-14px;left:-8px;z-index:2;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--berry);color:#fff;border:3px solid var(--paper);font:600 17px "Fredoka",sans-serif}
  .threat .corner{top:-8px;right:-8px}
  /* main-message stop is bigger than the warm-ups: wider card, large threat rows */
  .stop[data-main] .threats{grid-template-columns:1fr;gap:34px}
  .stop[data-main] .threat{flex-direction:row;align-items:stretch;gap:26px;padding:24px}
  .stop[data-main] .threat:nth-child(even){flex-direction:row-reverse}
  .stop[data-main] .timg,.stop[data-main] .threat .img-ph{flex:0 0 44%;width:44%;height:auto;min-height:260px}
  .stop[data-main] .tbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;min-width:0}
  .stop[data-main] .threat h3{font-size:clamp(26px,3.2vw,36px)}
  .stop[data-main] .threat .txt{font-size:19px;line-height:1.55}
  .stop[data-main] .tnum{width:44px;height:44px;font-size:22px;top:-18px;left:-12px}
  .stop[data-main] .block-title{font-size:24px}
  .apic{margin-top:14px;max-height:340px}
  .credit{margin:8px 0 0;font-size:13px;line-height:1.4;font-weight:700;color:var(--muted)}
  .credit b{font-weight:800}
  .back .credit{margin-top:8px;font-size:11px;color:var(--dash)}
  /* Industrial Development (threat 2): wide, rectangular picture across the top */
  .stop[data-main] .threat:nth-child(2){flex-direction:column;gap:18px}
  .stop[data-main] .threat:nth-child(2) .timg,.stop[data-main] .threat:nth-child(2) .img-ph{flex:none;width:100%;height:auto;min-height:0;aspect-ratio:16/7}
  @media (min-width:761px){
    .stop[data-main] .card{width:88%;padding:clamp(26px,3.6vw,46px)}
    .stop[data-main][data-side="left"] .card{margin-left:12%}
    .stop[data-main][data-side="right"] .card{margin-right:12%}
    .stop[data-main][data-side="left"] .stop-sign{left:6%}
    .stop[data-main][data-side="right"] .stop-sign{left:94%}
  }
  @media (max-width:760px){
    .stop[data-main] .threat,.stop[data-main] .threat:nth-child(even){flex-direction:column;padding:18px 14px 14px}
    .stop[data-main] .timg,.stop[data-main] .threat .img-ph{flex:none;width:100%;min-height:0;height:190px}
    .stop[data-main] .threat .txt{font-size:17px}
  }
  .boxc:has(>.corner)>.txt{padding-right:34px}
  .corner{position:absolute;top:-6px;right:-6px;z-index:2;display:grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--brown);border:2px solid var(--paper);color:#fff;font:800 12px/1 "Nunito",sans-serif;text-decoration:none;box-shadow:0 2px 0 rgba(61,46,36,.2);cursor:pointer}
  .corner:hover,.corner:focus-visible{background:var(--cocoa)}
  .acc .corner{top:0;right:10px}
  .back .corner{top:10px;right:10px;background:var(--dash);color:var(--cocoa);border-color:var(--cocoa)}
  .fimg{width:100%;height:84px;object-fit:cover;border-radius:12px;border:2px solid var(--sand)}
  .pic.thumb{width:72px;height:56px;max-height:none;border-radius:12px}
  .ed-src{width:90px;font-weight:800;color:var(--cocoa);padding:6px 10px;background:#fff;border-radius:10px;min-height:1.7em}

  /* reveal on scroll */
  .reveal{opacity:0;transform:translateY(30px);transition:opacity .7s ease,transform .7s ease}
  .reveal.in{opacity:1;transform:none}

  @media (max-width:760px){
    body{font-size:16px}
    .brand span{display:none}
    .stop{margin-bottom:80px}
    .stop .stop-sign,.stop[data-side] .stop-sign{left:26px}
    .stop-sign .num{width:46px;height:46px;font-size:20px;border-width:4px}
    .stop-sign .lbl{display:none}
    .stop[data-side] .card{width:auto;margin:0 0 0 58px}
    .flips{grid-template-columns:1fr}
    .opts.two{grid-template-columns:1fr}
    .fern{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}
  }

  .txt{margin:0;white-space:normal}
  .edit-btn{background:var(--paper);border:2px solid var(--sand);border-radius:999px;padding:6px 14px;font-weight:800;color:var(--cocoa);font-size:15px}
  .edit-btn[hidden]{display:none}
  body.editing .edit-btn{background:var(--brown);border-color:var(--brown);color:#fff}

  /* editable fields */
  [data-f]{border-radius:10px;cursor:text;transition:outline-color .15s,background .15s}
  body.editing [data-f]{outline:2px dashed var(--latte);outline-offset:3px;min-width:2ch;display:inline-block}
  body.editing div[data-f],body.editing p[data-f],body.editing h3[data-f]{display:block}
  body.editing [data-f]:hover{background:rgba(255,255,255,.7)}
  body.editing [data-f]:focus{outline:3px solid var(--brown);background:#fff}
  [data-f]:empty::before{content:attr(data-ph);color:#B9A58F;font-style:italic;font-weight:600}
  .ed-area{min-height:3.2em;padding:10px 12px;background:#fff;border-radius:14px;font-weight:600;color:var(--ink)}
  .ed-line{flex:1;font-weight:800;color:var(--cocoa);padding:6px 10px;background:#fff;border-radius:10px;min-height:1.7em}
  .ed-icon{flex:none;width:52px;text-align:center;font-size:24px;padding:4px;background:#fff;border-radius:10px}
  .ed-lbl{font-family:"Fredoka";font-weight:600;color:var(--brown);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
  .ed-item{background:var(--cream);border-radius:18px;padding:14px;display:grid;gap:10px}
  .ed-list{display:grid;gap:12px}
  .ed-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .ed-row{display:flex;gap:8px;align-items:center}
  .ed-row .letter{flex:none;width:30px;height:30px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-family:"Fredoka";font-weight:600;color:var(--cocoa)}
  .ed-head{display:flex;justify-content:space-between;align-items:center}
  .add-btn{width:100%;margin-top:12px;background:none;border:2px dashed var(--latte);border-radius:16px;padding:10px;font-weight:800;color:var(--brown)}
  .add-btn:hover{background:var(--cream)}
  .del-btn{flex:none;background:#fff;border:2px solid var(--sand);border-radius:50%;width:32px;height:32px;display:grid;place-items:center;font-size:13px;color:var(--berry);padding:0}
  .del-btn:hover{border-color:var(--berry)}
  .correct-btn{flex:none;border:2px solid var(--sand);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800;color:var(--muted)}
  .correct-btn.on{background:var(--sage-d);border-color:var(--sage-d);color:#fff}
  .edit-note{margin:0;font-size:13px;color:var(--muted);font-weight:700}

  /* save strip */
  .save-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--cream);border:2px solid var(--sand);border-radius:18px;padding:8px 8px 8px 14px;margin:0 0 18px;text-align:left}
  .status{font-weight:800;font-size:14px;color:var(--sage-d)}
  .status.dirty{color:var(--berry)}
  .strip-btns{display:flex;gap:8px}
  .save-btn{background:var(--sage-d);color:#fff;border:0;border-radius:999px;padding:8px 16px;font-weight:800;box-shadow:0 3px 0 #4f6741}
  .save-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #4f6741}
  .save-btn:disabled,.ghost-btn:disabled{opacity:.45;cursor:default;transform:none}
  .ghost-btn{background:#fff;border:2px solid var(--sand);border-radius:999px;padding:6px 14px;font-weight:800;color:var(--cocoa)}
  body.editing .card{outline:3px dashed var(--latte);outline-offset:6px}
  body.editing .reveal{opacity:1;transform:none}

  /* pictures */
  .pic{display:block;width:100%;max-height:440px;object-fit:cover;border-radius:20px;border:2px solid var(--sand)}
  .caption{margin:8px 0 0;text-align:center;color:var(--muted);font-weight:700;font-size:15px}
  .up-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
  .up-btn{display:inline-flex;align-items:center;gap:6px;background:var(--brown);color:#fff;border-radius:999px;padding:8px 16px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--cocoa)}
  .up-btn input{display:none}

  /* edit bar */
  .edit-bar{position:fixed;left:50%;bottom:16px;transform:translate(-50%,160%);z-index:55;background:var(--cocoa);color:var(--paper);border-radius:999px;padding:8px 8px 8px 20px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(61,46,36,.3);transition:transform .3s;max-width:calc(100% - 24px)}
  body.editing .edit-bar{transform:translate(-50%,0)}
  .edit-bar .bar-txt{font-weight:700;font-size:14px}
  .edit-bar button{border:0;border-radius:999px;padding:9px 16px;font-weight:800;white-space:nowrap}
  .final-btn{background:var(--dash);color:var(--cocoa)}
  .done-btn{background:var(--paper);color:var(--cocoa)}

  /* toast + modal */
  .toast{position:fixed;left:50%;top:78px;transform:translateX(-50%);z-index:95;background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:700;font-size:15px;animation:toast 3s ease forwards;max-width:90vw;text-align:center}
  @keyframes toast{0%{opacity:0;transform:translate(-50%,-10px)}8%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
  .modal-bg{position:fixed;inset:0;z-index:90;background:rgba(61,46,36,.4);display:grid;place-items:center;padding:16px}
  .modal{background:var(--paper);border-radius:28px;padding:28px;max-width:460px;width:100%;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.2)}
  .modal svg{width:110px}
  .modal h3{font-size:28px;margin:4px 0 6px;color:var(--cocoa)}
  .modal p{color:var(--muted);font-weight:600;margin:6px 0}
  .modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
  .modal .row button{border:0;border-radius:999px;padding:11px 20px;font-weight:800}
  .btn-main{background:var(--brown);color:#fff;box-shadow:0 4px 0 var(--cocoa)}
  .btn-soft{background:var(--cream);color:var(--cocoa)}

  @media (max-width:760px){
    .edit-bar .bar-txt{display:none}
    .edit-bar{padding:8px}
    .ed-grid{grid-template-columns:1fr}
  }
</style>
</head>

const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } };
const normUrl = u => { u = String(u || "").trim(); if (!u) return ""; if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) u = "https://" + u; return /^https?:\/\/[^\s\/]+\.[^\s]+$/i.test(u) ? u : ""; };
const sourceList = () => { const s = model.sources, b = s && s.blocks && s.blocks.find(x => x.type === "sources"); return b ? b.items : []; };

  const it = sourceList()[n - 1], u = it && normUrl(it.url);
  if (!u) return m;
  const name = it.title ? esc(it.title) : "Source " + n;
  return `<sup class="cite"><a href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${name} (opens in a new tab)" aria-label="Source ${n}: ${name} (opens in a new tab)">${n}</a></sup>`;
});
const ph = t => `<p class="ph">✏️ ${esc(t)}</p>`;
const LETTERS = "ABCDEFGH";

  const it = sourceList()[n - 1], u = it && normUrl(it.url);
  if (!u) return "";
  const t = `Source ${n}: ${esc(it.title || hostOf(u))} (opens in a new tab)`;
  return asSpan
    ? `<span class="corner" role="link" data-href="${esc(u)}" title="${t}" aria-label="${t}">${n}</span>`
    : `<a class="corner" href="${esc(u)}" target="_blank" rel="noopener noreferrer" title="${t}" aria-label="${t}">${n}</a>`;

/* ---------------- field builder ----------------
   In edit mode a field is an editable box; otherwise plain text
   (or a fallback when it's still empty). */
function F(tag, path, value, hint, cls = "", fallback = "", multi = false) {
  if (editing) return `<${tag} class="${cls}${multi ? "" : " one"}" data-f="${path}" data-ph="${esc(hint)}">${esc(value || "")}</${tag}>`;
  const shown = value ? txt(value) : fallback;
  return `<${tag} class="${cls.replace(/\bed-\w+/g, "")}">${shown}</${tag}>`;
}
const lbl = t => `<span class="ed-lbl">${esc(t)}</span>`;

function strip(id) {
  if (!editing) return "";
  const d = dirty[id], s = saving[id];
  return `<div class="save-strip" data-strip="${id}">
    <span class="status ${d ? "dirty" : ""}">${s ? "Saving…" : d ? "● Unsaved changes" : "✓ All saved"}</span>
    <span class="strip-btns">
      <button class="ghost-btn" data-act="undo" data-id="${id}" ${d && !s ? "" : "disabled"}>Undo changes</button>
      <button class="save-btn" data-act="save" data-id="${id}" ${d && !s ? "" : "disabled"}>💾 Save this part</button>
    </span></div>`;
}
function updateStrip(id) {
  const old = document.querySelector(`[data-strip="${id}"]`);

        ${src ? `<button class="ghost-btn" data-act="rmimg" data-key="${b.key}">Remove picture</button>` : ""}

        <div class="ed-row">${F("div", `${p}.items.${i}`, t, "I promise to… (a way to help badgers)", "ed-line")}${del(p + ".items", i)}</div>`).join("")}</div>

    case "sources":
      if (editing) return `<div class="block">${title}<p class="edit-note">To cite a source, type its number in square brackets anywhere in your text, like [1]. It becomes a small link to that website. Text boxes, drop-downs and flip cards also have a “Source #” spot: type a number there and a small numbered badge appears in that box’s corner.</p><div class="ed-list" style="margin-top:10px">${b.items.map((it, i) => `

        ${F("div", `${p}.items.${i}.url`, it.url, "Paste the web address here (https://…)", "ed-line")}</div>`).join("")}</div>

          : ph("Add a source name and web address here.")}</div></li>`; }).join("")}</ol></div>`;

    case "quiz":
      if (editing) return `<div class="block"><div class="ed-list">${b.questions.map((q, i) => {
        const qp = `${p}.questions.${i}`;
        return `<div class="ed-item"><div class="ed-head">${lbl("Question " + (i + 1))}${del(p + ".questions", i)}</div>
          ${F("div", qp + ".q", q.q, "Write question " + (i + 1) + " here", "ed-line")}
          ${q.options.map((o, k) => `<div class="ed-row"><span class="letter">${LETTERS[k]}</span>${F("div", `${qp}.options.${k}`, o, "Answer " + LETTERS[k], "ed-line")}${correctBtn(qp + ".correct", k, q.correct === k, q.correct === k ? "✓ Right" : "Right?")}</div>`).join("")}

      return `<div class="block"><div class="quiz" data-qp="${p}" data-key="${key}" data-qcount="${b.questions.length}"></div></div>`;
  }
  return "";
}

function initQuiz(el, qs, key) {
  let i = 0, score = 0;
  const dots = () => `<div class="qdots">${qs.map((_, k) => `<i class="${k < i ? "done" : k === i ? "now" : ""}"></i>`).join("")}</div>`;
  function show() {
    const q = qs[i];
    el.innerHTML = `<div class="quiz-top"><span>Question ${i + 1} of ${qs.length}</span>${dots()}</div>
      <p class="q">${q.q ? txt(q.q) : `Question ${i + 1} goes here?`}</p>
      <div class="opts">${q.options.map((o, k) => `<button class="opt" data-k="${k}"><span class="letter">${LETTERS[k]}</span>${esc(o || "Answer " + LETTERS[k])}</button>`).join("")}</div>
      <div class="fb" hidden></div>`;
    el.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k, b));
  }
  function answer(k, btn) {
    const q = qs[i], ok = k === q.correct;
    if (ok) score++;
    el.querySelectorAll(".opt").forEach(b => { b.disabled = true; if (+b.dataset.k === q.correct) b.classList.add("right"); });
    if (!ok) btn.classList.add("wrong");
    const fb = el.querySelector(".fb");
    fb.hidden = false; fb.className = "fb " + (ok ? "good" : "bad");
    fb.innerHTML = (ok ? "Correct! 🎉" : "Not quite — the right answer is highlighted.")
      + (q.explain ? `<p class="txt" style="margin-top:6px;color:var(--ink)">${txt(q.explain)}</p>` : ph("Explain the right answer here."))
      + `<button class="next-btn">${i < qs.length - 1 ? "Next question →" : "See my score ⭐"}</button>`;
    fb.querySelector(".next-btn").onclick = () => { i++; i < qs.length ? show() : finish(); };
    collect(key + "-" + i, btn);
  }
  function finish() {
    const pct = score / qs.length, stars = pct === 1 ? 3 : pct >= .6 ? 2 : 1;
    const msg = pct === 1 ? "Perfect score! You're a badger expert." : pct >= .6 ? "Solid work — you know your badgers." : "Good effort — try the trail again to boost your score.";
    el.innerHTML = `<div class="result">${badgerSvg("Happy badger")}
      <div class="stars">${"⭐".repeat(stars)}${"☆".repeat(3 - stars)}</div>
      <h3>${score} / ${qs.length}</h3><p style="margin:0 0 6px;font-weight:800;color:var(--brown)">${msg}</p>
      <button class="next-btn">Try again ↻</button></div>`;
    el.querySelector(".next-btn").onclick = () => { i = 0; score = 0; show(); };
    confetti();
  }
  if (!qs.length) { el.innerHTML = ph("Add quiz questions in Edit mode."); return; }
  show();
}

function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const bits = ["🐾", "🤎", "✨", "🍂", "⭐"];
  for (let k = 0; k < 34; k++) {
    const s = document.createElement("span");
    s.className = "confetti"; s.textContent = bits[k % bits.length];
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = (1.8 + Math.random() * 1.6) + "s";
    s.style.animationDelay = Math.random() * .4 + "s";
    document.body.appendChild(s); setTimeout(() => s.remove(), 4000);
  }
}

async function act(btn) {
  const a = btn.dataset.act, id = btn.dataset.id;
  if (a === "save") return save(id);
  if (a === "undo") { drafts[id] = clone(model[id]); dirty[id] = false; rerender(id); return; }
  if (a === "rmimg") return removeImage(btn.dataset.key);
  sync(id);
  const d = drafts[id];
  if (a === "add") {
    const it = clone(NEW_ITEM[btn.dataset.kind]);
    if (btn.dataset.kind === "flip" && id === "food") it.pic = "f" + Date.now().toString(36);
    getP(d, btn.dataset.p).push(it);
  }
  if (a === "del") {
    const arr = getP(d, btn.dataset.p);
    if (arr.length <= 1) { toast("Each part needs at least one item 🙂"); return; }
    arr.splice(+btn.dataset.i, 1);
  }
  if (a === "setv") { const v = btn.dataset.v; setP(d, btn.dataset.p, v === "true" ? true : v === "false" ? false : Number(v)); }
  dirty[id] = true; rerender(id);
}

function explain(err) {
  const c = err && err.code;
  if (c === "invalid_argument") return "You can't save yet. Ask the owner to share the site with you as an Editor.";
  if (c === "quota_exceeded") return "The site's storage is full. Try removing a picture.";
  if (c === "badimg") return "That file doesn't look like a picture. Try a JPG or PNG.";
  if (c === "nodb") return "Saving isn't available here right now.";
  return "Couldn't save. Check your internet and try again.";
}

async function save(id) {
  if (!db) { toast(explain({ code: "nodb" })); return; }
  sync(id);
  const data = clone(drafts[id]);
  saving[id] = true; updateStrip(id);
  try {
    await db.doc("site/" + id).set(data);
    model[id] = clone(data); dirty[id] = false;
    toast("Saved! 🎉"); buildMenu();
    if (id === "hero") document.querySelector("#footer").textContent = `Made with 🤎 by ${data.team || "[your team]"} · Class project 2026`;
  } catch (err) {
    if (err && err.code === "unavailable") {
      try { await new Promise(r => setTimeout(r, 800 + Math.random() * 700)); await db.doc("site/" + id).set(data); model[id] = clone(data); dirty[id] = false; toast("Saved! 🎉"); }
      catch (e2) { toast(explain(e2)); }
    } else toast(explain(err));
  }
  saving[id] = false; updateStrip(id);
}

function rerenderKey(key) {
  order.forEach(id => {
    if (!cur(id).blocks.some(b => (b.type === "image" && b.key === key) || (b.type === "flips" && b.cards.some(c => c.pic === key)) || (b.type === "threats" && b.items.some(c => c.pic === key)) || (b.type === "accordion" && b.items.some(c => c.pic === key)))) return;
    if (editing) sync(id);
    rerender(id);
  });
}

async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej({ code: "badimg" }); i.src = url; });
    let max = 1100, q = .82, out = "";
    for (let t = 0; t < 8; t++) {
      const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.max(1, Math.round(img.naturalWidth * sc)); c.height = Math.max(1, Math.round(img.naturalHeight * sc));
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      out = c.toDataURL("image/jpeg", q);
      if (out.length < 240000) break;
      max *= .8; q = Math.max(.55, q - .06);
    }
    return out;
  } finally { URL.revokeObjectURL(url); }
}

document.addEventListener("change", async e => {
  const inp = e.target.closest && e.target.closest("input[data-img]");
  if (!inp || !inp.files[0]) return;
  const key = inp.dataset.img, file = inp.files[0];
  inp.value = "";

    if (!db) throw { code: "nodb" };
    if (!file.type.startsWith("image/")) throw { code: "badimg" };
    toast("Adding your picture…");
    const src = await shrink(file);
    await db.doc("pics/" + key).set({ src });
    images[key] = src; rerenderKey(key);
    toast("Picture saved! 📷");
  } catch (err) { toast(explain(err)); }
});

async function removeImage(key) {

}

async function setEditing(on) {

/* ---------------- final project ---------------- */
function countEmpty() {
  let n = 0; const e = v => { if (!v) n++; };
  order.forEach(id => model[id].blocks.forEach(b => {
    if (b.type === "text") e(b.text);
    if (b.type === "image") e(images[b.key]);
    if (b.type === "accordion") b.items.forEach(it => e(it.a));
    if (b.type === "flips") b.cards.forEach(c => e(c.a));
    if (b.type === "threats") b.items.forEach(it => { e(it.title); e(it.a); });
    if (b.type === "tf") { e(b.q); e(b.explain); }
    if (b.type === "mc") { e(b.q); b.options.forEach(e); }
    if (b.type === "pledge") b.items.forEach(e);
    if (b.type === "sources") b.items.forEach(it => { e(it.title); e(it.url); });
    if (b.type === "quiz") b.questions.forEach(q => { e(q.q); q.options.forEach(e); });
  }));
  e(model.hero.team);
  return n;
}

function buildFinalFile() {
  const json = JSON.stringify({ model, images }).replace(/</g, "\\u003c");
  const title = esc(`${model.hero.t1} ${model.hero.t2}`.trim() || "The Badger Trail");
  return `<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>${title} · The Badger Trail</title>\n${FONT_LINKS}\n<style id="css">${document.getElementById("css").textContent}</style>\n</head>\n<body>\n<script>window.__BAKED__=${json};<\/script>\n<template id="shell">${shellTpl.innerHTML}</template>\n<script id="app">${document.getElementById("app").textContent}<\/script>\n</body>\n</html>\n`;
}

document.querySelector("#finalBtn").onclick = async () => {

    [{ label: "Not yet", value: false }, { label: "📦 Download", value: true, main: true }]);
  if (!go) return;
  const dl = window.claude && claude.use ? await claude.use("downloads") : null;
  if (!dl) { toast("Downloading isn't available here. Open the site on claude.ai to download."); return; }
  try {
    await dl.save({ filename: "badger-trail-final-project.html", data: buildFinalFile() });
    toast("Final project saved! 🎉"); confetti();
  } catch (err) {
    if (err && err.code === "declined") return;
    toast(err && err.code === "rate_limited" ? "Hang on a second and try again." : "Couldn't download the file. Try again.");
  }
};

/* ---------------- shared storage ---------------- */
function valid(id, d) {
  if (!d || typeof d !== "object") return false;
  if (id === "hero") return ["kicker", "t1", "t2", "lead", "team"].every(k => typeof (d[k] ?? "") === "string");
  return Array.isArray(d.blocks) && typeof (d.title ?? "") === "string";
}
async function initCloud() {
  if (BAKED || !window.claude || !claude.use) return;
  db = await claude.use("db");
  if (!db) return;
  let canWrite = null;
  try { const user = await claude.use("user"); if (user && user.can) canWrite = await user.can("data.write"); } catch (e) {}
  if (canWrite !== false) document.querySelector("#editBtn").hidden = false;

  const timer = setTimeout(() => { if (canWrite !== false) toast("Still loading your saved work…"); }, 10000);
  db.collection("site").onSnapshot(snap => {
    if (!snap.metadata.fromCache) clearTimeout(timer);
    snap.docs.forEach(d => {
      const id = d.id, data = d.data();
      if (!(id in model) || !valid(id, data)) return;
      if (JSON.stringify(data) === JSON.stringify(model[id])) return;
      model[id] = clone(data);
      if (editing) {
        if (dirty[id]) { toast("A teammate just saved a part you're editing. Your version will replace theirs if you save."); return; }
        drafts[id] = clone(data);
      }
      rerender(id);
    });
  }, () => clearTimeout(timer));
  db.collection("pics").onSnapshot(snap => {
    snap.docChanges().forEach(ch => {
      const key = ch.doc.id;
      if (ch.type === "removed") delete images[key];
      else { const s = ch.doc.data().src; if (typeof s === "string" && s.startsWith("data:image/")) images[key] = s; else return; }
      rerenderKey(key);
    });
  }, () => {});
}

/* ---------------- reveal + ferns ---------------- */
renderAll();
const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: .12 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));

function fernSvg() {
  let leaves = "";
  for (let k = 0; k < 9; k++) {
    const y = 200 - k * 21, s = 1 - k * .07;
    leaves += `<ellipse cx="${50 - 19 * s}" cy="${y}" rx="${21 * s}" ry="${6.5 * s}" transform="rotate(-32 ${50 - 19 * s} ${y})"/>`;
    leaves += `<ellipse cx="${50 + 19 * s}" cy="${y - 8}" rx="${21 * s}" ry="${6.5 * s}" transform="rotate(32 ${50 + 19 * s} ${y - 8})"/>`;
  }
  return `<svg viewBox="0 0 100 230" fill="#D6C4AC"><path d="M50 230 Q47 120 52 10" stroke="#D6C4AC" stroke-width="3.5" fill="none"/>${leaves}<ellipse cx="52" cy="14" rx="5" ry="12"/></svg>`;
}
const decor = document.querySelector("#decor");
[[6, -4, -12], [18, 93, 14], [33, -5, 8], [47, 94, -10], [62, -3, -6], [76, 93, 12], [88, -4, 10]].forEach(([top, left, rot]) => {
  const d = document.createElement("div");
  d.className = "fern"; d.innerHTML = fernSvg();
  d.style.top = top + "%"; d.style.left = left + "%"; d.style.transform = `rotate(${rot}deg)`;
  decor.appendChild(d);
});

/* ---------------- the winding road ---------------- */
const journey = document.querySelector("#journey");
const svg = document.querySelector("#road");
const paths = ["roadShadow", "roadEdge", "roadBase", "roadDash"].map(id => document.getElementById(id));
const walker = document.querySelector("#walker");
let samples = [];
function centerOf(el, jr) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2 - jr.left, y: r.top + r.height / 2 - jr.top }; }
function smoothPath(p) {
  let d = `M${p[0].x},${p[0].y}`;
  for (let i = 0; i < p.length - 1; i++) {
    const p0 = p[i - 1] || p[i], p1 = p[i], p2 = p[i + 1], p3 = p[i + 2] || p2;
    d += ` C${p1.x + (p2.x - p0.x) / 6},${p1.y + (p2.y - p0.y) / 6} ${p2.x - (p3.x - p1.x) / 6},${p2.y - (p3.y - p1.y) / 6} ${p2.x},${p2.y}`;
  }
  return d;
}
function buildRoad() {
  const jr = journey.getBoundingClientRect();
  const W = journey.clientWidth, H = journey.scrollHeight, mobile = innerWidth <= 760;
  svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const pts = [], start = centerOf(document.querySelector("#roadStart"), jr);
  pts.push({ x: start.x, y: start.y + 10 });
  const amp = mobile ? 10 : Math.min(60, W * .05);
  document.querySelectorAll(".stop").forEach(sec => {
    const sign = centerOf(sec.querySelector(".stop-sign .num"), jr), r = sec.getBoundingClientRect();
    const top = r.top - jr.top, bottom = r.bottom - jr.top, h = bottom - top, dir = sec.dataset.side === "left" ? 1 : -1;
    pts.push({ x: sign.x, y: sign.y });
    if (h > 420) { pts.push({ x: sign.x + amp * dir, y: top + h * .38 }); pts.push({ x: sign.x - amp * dir * .7, y: top + h * .7 }); }
    else pts.push({ x: sign.x + amp * dir * .6, y: top + h * .55 });
    pts.push({ x: sign.x, y: bottom - 10 });
  });
  const end = centerOf(document.querySelector("#roadEnd"), jr);
  pts.push({ x: end.x, y: end.y + 70 });
  const d = smoothPath(pts), w = mobile ? 34 : 58;
  paths.forEach(p => p.setAttribute("d", d));
  paths[0].setAttribute("stroke-width", w + 8); paths[0].setAttribute("transform", "translate(0 7)");
  paths[1].setAttribute("stroke-width", w + 8);
  paths[2].setAttribute("stroke-width", w);
  paths[3].setAttribute("stroke-width", mobile ? 3.5 : 5.5);
  paths[3].setAttribute("stroke-dasharray", mobile ? "12 12" : "20 18");
  const L = paths[3].getTotalLength();
  samples = [];
  for (let k = 0; k <= 700; k++) { const pt = paths[3].getPointAtLength(L * k / 700); samples.push({ x: pt.x, y: pt.y }); }
  document.querySelector("#walkerArt").setAttribute("transform", mobile ? "translate(-24,-46) scale(.24)" : "translate(-34,-62) scale(.34)");
  moveWalker();
}
function moveWalker() {
  if (!samples.length) return;
  const target = innerHeight * .55 - journey.getBoundingClientRect().top;
  let pt = samples[0];
  for (const s of samples) { pt = s; if (s.y >= target) break; }
  walker.setAttribute("transform", `translate(${pt.x} ${pt.y})`);
}
let raf = 0;
const schedule = fn => { cancelAnimationFrame(raf); raf = requestAnimationFrame(fn); };
addEventListener("scroll", () => requestAnimationFrame(moveWalker), { passive: true });
addEventListener("resize", () => schedule(buildRoad));
new ResizeObserver(() => schedule(buildRoad)).observe(journey);
document.fonts && document.fonts.ready.then(buildRoad);
buildRoad();

initCloud();
</script>
</body>
